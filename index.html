<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Drill" />
  <title>SUBTRACTION DRILL</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">

    <!-- ── top bar: where you are, how you're doing right now ── -->
    <header class="bar">
      <div class="bar-l">
        <div class="stage-tag" id="stageTag">STAGE 1 · INTEGER</div>
        <div class="level-name" id="levelName">2-digit − 1-digit</div>
      </div>
      <div class="bar-r">
        <div class="streak" id="streak">0</div>
        <div class="streak-lbl">streak</div>
      </div>
    </header>

    <div class="gatebar"><div class="gatefill" id="gateFill"></div><span class="gatetext" id="gateText">20 to go</span></div>

    <!-- ── the drill ── -->
    <section class="drill">
      <div id="question" class="question">READY</div>
      <div id="feedback" class="feedback">Press START</div>
      <input id="answer" class="answer" inputmode="text" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="answer" />
      <div id="fracPad" class="fracpad hidden">
        <button data-f="1/8">⅛</button><button data-f="1/4">¼</button>
        <button data-f="3/8">⅜</button><button data-f="1/2">½</button>
        <button data-f="5/8">⅝</button><button data-f="3/4">¾</button>
        <button data-f="7/8">⅞</button>
      </div>
      <div id="pad16" class="fracpad pad16 hidden">
        <button data-f="1/16">1/16</button><button data-f="3/16">3/16</button>
        <button data-f="5/16">5/16</button><button data-f="7/16">7/16</button>
        <button data-f="9/16">9/16</button><button data-f="11/16">11/16</button>
        <button data-f="13/16">13/16</button><button data-f="15/16">15/16</button>
      </div>
      <div class="actions">
        <button id="goBtn" class="primary">START</button>
        <button id="skipBtn">SKIP</button>
      </div>
    </section>

    <!-- ── today, at a glance ── -->
    <section class="today">
      <div class="t-cell"><span id="tQ">0</span><small>questions</small></div>
      <div class="t-cell"><span id="tAcc">—</span><small>accuracy</small></div>
      <div class="t-cell"><span id="tMed">—</span><small>median</small></div>
      <div class="t-cell"><span id="tAvg">—</span><small>average</small></div>
      <div class="t-cell"><span id="tBest">—</span><small>best</small></div>
    </section>

    <!-- ── everything below is out of the way while drilling ── -->
    <details class="panel" id="dashPanel">
      <summary>Performance</summary>
      <div class="cat-rows" id="catRows"></div>
      <div class="weak-rows" id="weakRows"></div>
    </details>

    <details class="panel">
      <summary>Levels</summary>
      <label class="check"><input id="autoLevel" type="checkbox" checked /> auto-advance when I'm ready</label>
      <div class="ladder" id="ladder"></div>
    </details>

    <details class="panel">
      <summary>Settings</summary>
      <label class="check"><input id="soundChk" type="checkbox" checked /> sound</label>
      <button id="resetBtn" class="danger">Reset all progress</button>
    </details>
  </main>

  <script src="fx.js"></script>
  <script src="drill.js"></script>
  <script src="app.js"></script>
</body>
</html>
