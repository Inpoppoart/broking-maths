<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Broking Maths" />
  <title>Broking Maths</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div>
        <h1>Broking Maths</h1>
        <p class="subtitle">quarters, eighths, 70–350</p>
      </div>
      <button id="settingsBtn" class="ghost">⚙︎</button>
    </section>

    <section class="stats">
      <div><span id="score">0</span><small>score</small></div>
      <div><span id="streak">0</span><small>streak</small></div>
      <div><span id="timer">00:00</span><small>time</small></div>
    </section>

    <section class="card">
      <div class="mode-row">
        <button class="mode active" data-mode="normal">Normal</button>
        <button class="mode" data-mode="speed">Speed</button>
        <button class="mode" data-mode="hard">Hard</button>
      </div>

      <div id="question" class="question">Press Start</div>
      <div id="feedback" class="feedback">Mental math drill for broking boards.</div>

      <div class="input-wrap">
        <input id="answerInput" inputmode="decimal" autocomplete="off" placeholder="Answer e.g. 331 5/8 or 331.625" />
      </div>

      <div class="fraction-buttons">
        <button data-frac="1/8">⅛</button>
        <button data-frac="1/4">¼</button>
        <button data-frac="3/8">⅜</button>
        <button data-frac="1/2">½</button>
        <button data-frac="5/8">⅝</button>
        <button data-frac="3/4">¾</button>
        <button data-frac="7/8">⅞</button>
      </div>

      <div class="actions">
        <button id="startBtn" class="primary">Start</button>
        <button id="checkBtn">Check</button>
        <button id="skipBtn">Skip</button>
      </div>
    </section>

    <section class="history-card">
      <h2>Last answers</h2>
      <ul id="history"></ul>
    </section>

    <section id="settingsPanel" class="settings hidden">
      <h2>Settings</h2>
      <label>
        Min
        <input id="minVal" type="number" value="70" min="1" max="999" />
      </label>
      <label>
        Max
        <input id="maxVal" type="number" value="350" min="1" max="999" />
      </label>
      <label>
        Rounds
        <input id="roundsVal" type="number" value="20" min="5" max="200" />
      </label>
      <label class="check">
        <input id="allowNeg" type="checkbox" />
        allow negative results
      </label>
      <button id="saveSettings" class="primary">Save</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
